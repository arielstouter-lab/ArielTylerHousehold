<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>

<style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:transparent;}
    .lst-back {
        display: inline-flex; align-items: center; gap: 6px;
        margin-bottom: 16px; padding: 7px 12px; border-radius: 8px;
        color: var(--green); text-decoration: none; font-size: 13px; font-weight: 600;
    }
    .lst-back:hover { background: var(--card); }

    .lst-status{font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;min-height:14px;}

    .lst-new-section{display:flex;gap:8px;margin-bottom:20px;}
    .lst-new-section input{
        flex:1;max-width:280px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;
        background:var(--paper);font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
    }
    .lst-new-section input:focus{outline:none;border-color:var(--green);}

    .lst-sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}

    .lst-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;}
    .lst-section-head{
        display:flex;align-items:center;justify-content:space-between;
        padding:14px 16px;border-bottom:1px solid var(--line);
    }
    .lst-section-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0;}
    .lst-section-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:2px;}
    .lst-section-del:hover{color:var(--brick);}

    .lst-items{padding:10px 14px 4px;flex:1;}
    .lst-empty{color:var(--ink-soft);font-size:12.5px;font-style:italic;padding:4px 0 12px;}

    .lst-item{
        border:1px solid var(--line);border-radius:8px;background:var(--paper);
        padding:9px 10px;margin-bottom:8px;display:flex;flex-direction:column;gap:5px;
    }
    .lst-item.priority{border-color:var(--brick);background:#fbf1ee;}
    .lst-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
    .lst-item-text{font-size:13.5px;color:var(--ink);word-break:break-word;}
    .lst-item.priority .lst-item-text{font-weight:600;color:var(--brick);}
    .lst-item-del{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:0 2px;flex:0 0 auto;}
    .lst-item-del:hover{color:var(--brick);}

    .lst-item-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--ink-soft);}
    .lst-chip{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 7px;}
    .lst-chip.due-soon{border-color:var(--ochre);color:var(--ochre);}
    .lst-chip.overdue{border-color:var(--brick);color:var(--brick);}
    .lst-chip.priority-chip{background:var(--brick);color:white;border-color:var(--brick);font-weight:600;}

    .lst-add-item{padding:10px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;}
    .lst-add-item input[type=text]{
        padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);
        font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
    }
    .lst-add-item input[type=text]:focus{outline:none;border-color:var(--green);}
    .lst-add-row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
    .lst-add-row2 select, .lst-add-row2 input[type=date]{
        padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
        font-family:'Inter',sans-serif;font-size:12px;color:var(--ink);flex:1;min-width:110px;
    }
    .lst-priority-toggle{
        display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);
        border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;user-select:none;
    }
    .lst-priority-toggle input{margin:0;}
    .lst-btn{
        font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
        padding:7px 12px;border:1px solid var(--green);background:var(--green);
        color:var(--paper);cursor:pointer;border-radius:9px;
    }
    .lst-btn:hover{background:var(--green-soft);border-color:var(--green-soft);}
</style>

<body class="app-page">
<div class="app-shell">
    <main class="main-content">
        <a href="app.html" class="lst-back">&larr; Back</a>

        <header class="topbar">
            <div class="text-center">
                <h1>Lists</h1>
                <p>Grocery lists, errands, anything else — grouped into sections.</p>
            </div>
        </header>

        <section class="content">
            <div class="lst-status" id="lst-status"></div>

            <div class="lst-new-section">
                <input type="text" id="lst-new-section-name" placeholder="New section, e.g. Groceries" />
                <button class="lst-btn" id="lst-add-section">Add section</button>
            </div>

            <div class="lst-sections" id="lst-sections"></div>
        </section>
    </main>
</div>
</body>

<script>
    (function(){
        const sb = window.supabaseClient;
        let sections = [];
        let itemsBySection = {};
        let people = [];

        function setStatus(msg){
            const el = document.getElementById('lst-status');
            el.textContent = msg || '';
            if(msg) setTimeout(()=>{ if(el.textContent===msg) el.textContent=''; }, 2200);
        }

        function escapeHtml(s){
            return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function todayStr(){
            const t = new Date();
            return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
        }

        function sortItems(items){
            return [...items].sort((a,b) => {
                if(a.priority !== b.priority) return a.priority ? -1 : 1;
                if(a.due_date && b.due_date) return a.due_date < b.due_date ? -1 : (a.due_date > b.due_date ? 1 : 0);
                if(a.due_date && !b.due_date) return -1;
                if(!a.due_date && b.due_date) return 1;
                return a.created_at < b.created_at ? -1 : 1;
            });
        }

        async function loadAll(){
            try{
                const [{data: peopleData}, {data: sectionData}, {data: itemData}] = await Promise.all([
                    sb.from('household_people').select('*').order('created_at'),
                    sb.from('household_list_sections').select('*').order('created_at'),
                    sb.from('household_list_items').select('*').order('created_at')
                ]);
                people = peopleData || [];
                sections = sectionData || [];
                itemsBySection = {};
                (itemData || []).forEach(item => {
                    itemsBySection[item.section_id] = itemsBySection[item.section_id] || [];
                    itemsBySection[item.section_id].push(item);
                });
            } catch(e){
                setStatus('Could not load lists.');
                sections = []; itemsBySection = {}; people = [];
            }
            render();
        }

        function personName(id){
            const p = people.find(p => p.id === id);
            return p ? p.name : null;
        }

        function dueClass(dateStr){
            if(!dateStr) return '';
            const today = todayStr();
            if(dateStr < today) return 'overdue';
            if(dateStr === today) return 'due-soon';
            return '';
        }

        function render(){
            const wrap = document.getElementById('lst-sections');
            if(sections.length === 0){
                wrap.innerHTML = '<p class="lst-empty">No sections yet — add one above.</p>';
                return;
            }

            const peopleOptions = people.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');

            wrap.innerHTML = sections.map(sec => {
                const items = sortItems(itemsBySection[sec.id] || []);
                const itemsHtml = items.length ? items.map(item => {
                    const chips = [];
                    if(item.priority) chips.push(`<span class="lst-chip priority-chip">High priority</span>`);
                    if(item.assigned_to && personName(item.assigned_to)) chips.push(`<span class="lst-chip">${escapeHtml(personName(item.assigned_to))}</span>`);
                    if(item.due_date) chips.push(`<span class="lst-chip ${dueClass(item.due_date)}">${item.due_date}</span>`);
                    return `
          <div class="lst-item ${item.priority ? 'priority' : ''}" data-item-row="${item.id}">
            <div class="lst-item-top">
              <span class="lst-item-text">${escapeHtml(item.text)}</span>
              <button class="lst-item-del" data-del-item="${item.id}" title="Remove">✕</button>
            </div>
            ${chips.length ? `<div class="lst-item-meta">${chips.join('')}</div>` : ''}
          </div>`;
                }).join('') : '<p class="lst-empty">Nothing here yet.</p>';

                return `
        <div class="lst-section" data-section="${sec.id}">
          <div class="lst-section-head">
            <h2 class="lst-section-title">${escapeHtml(sec.name)}</h2>
            <button class="lst-section-del" data-del-section="${sec.id}" title="Remove section">✕</button>
          </div>
          <div class="lst-items">${itemsHtml}</div>
          <div class="lst-add-item">
            <input type="text" placeholder="Add an item" data-new-item-text="${sec.id}" />
            <div class="lst-add-row2">
              <select data-new-item-person="${sec.id}">
                <option value="">Unassigned</option>
                ${peopleOptions}
              </select>
              <input type="date" data-new-item-due="${sec.id}" />
              <label class="lst-priority-toggle">
                <input type="checkbox" data-new-item-priority="${sec.id}" /> High priority
              </label>
              <button class="lst-btn" data-add-item="${sec.id}">Add</button>
            </div>
          </div>
        </div>`;
            }).join('');
        }

        document.getElementById('lst-add-section').addEventListener('click', async () => {
            const input = document.getElementById('lst-new-section-name');
            const name = input.value.trim();
            if(!name) return;
            try{
                const {data, error} = await sb.from('household_list_sections').insert({name}).select().single();
                if(error || !data){ setStatus('Could not add section.'); return; }
                sections.push(data);
                itemsBySection[data.id] = [];
                input.value = '';
                render();
            } catch(e){
                setStatus('Could not add section.');
            }
        });

        document.getElementById('lst-sections').addEventListener('click', async (e) => {
            const t = e.target;

            if(t.matches('[data-del-section]')){
                const id = t.getAttribute('data-del-section');
                sections = sections.filter(s => s.id !== id);
                delete itemsBySection[id];
                render();
                try{
                    await sb.from('household_list_sections').delete().eq('id', id);
                } catch(err){ setStatus('Could not delete section.'); }
                return;
            }

            if(t.matches('[data-del-item]')){
                const id = t.getAttribute('data-del-item');
                Object.keys(itemsBySection).forEach(secId => {
                    itemsBySection[secId] = itemsBySection[secId].filter(i => i.id !== id);
                });
                render();
                try{
                    await sb.from('household_list_items').delete().eq('id', id);
                } catch(err){ setStatus('Could not delete item.'); }
                return;
            }

            if(t.matches('[data-add-item]')){
                const sectionId = t.getAttribute('data-add-item');
                const textInput = document.querySelector(`[data-new-item-text="${sectionId}"]`);
                const personSelect = document.querySelector(`[data-new-item-person="${sectionId}"]`);
                const dueInput = document.querySelector(`[data-new-item-due="${sectionId}"]`);
                const priorityInput = document.querySelector(`[data-new-item-priority="${sectionId}"]`);

                const text = textInput.value.trim();
                if(!text) return;
                const assigned_to = personSelect.value || null;
                const due_date = dueInput.value || null;
                const priority = priorityInput.checked;

                try{
                    const {data, error} = await sb.from('household_list_items')
                        .insert({section_id: sectionId, text, assigned_to, due_date, priority})
                        .select()
                        .single();
                    if(error || !data){ setStatus('Could not add item.'); return; }
                    itemsBySection[sectionId] = itemsBySection[sectionId] || [];
                    itemsBySection[sectionId].push(data);
                    textInput.value = '';
                    personSelect.value = '';
                    dueInput.value = '';
                    priorityInput.checked = false;
                    render();
                } catch(e){
                    setStatus('Could not add item.');
                }
            }
        });

        document.getElementById('lst-sections').addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && e.target.matches('[data-new-item-text]')){
                const sectionId = e.target.getAttribute('data-new-item-text');
                document.querySelector(`[data-add-item="${sectionId}"]`).click();
            }
        });

        document.addEventListener('app:ready', loadAll, { once: true });
    })();
</script>
