<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app-page">

  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">A</div>
        <span>Your App</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active">
          <span class="nav-icon">⌂</span>
          Dashboard
        </a>

        <a href="#" class="nav-item">
          <span class="nav-icon">▣</span>
          Projects
        </a>

        <a href="#" class="nav-item">
          <span class="nav-icon">⚙</span>
          Settings
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="user-card">
          <div class="avatar" id="user-avatar">U</div>

          <div class="user-info">
            <span id="user-email">Loading...</span>
          </div>

          <button id="logout-button" class="logout-button" title="Sign out">
            ↪
          </button>
        </div>
      </div>
    </aside>

    <main class="main-content">

      <header class="topbar">
        <div>
          <h1>Dashboard</h1>
          <p>Welcome back.</p>
        </div>
      </header>

      <section class="content">
        <div class="welcome-card">
          <div>
            <span class="eyebrow">You're signed in</span>
            <h2>Welcome to your app.</h2>
            <p>
              This is your starting point. Replace this content with
              whatever your application needs.
            </p>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="stat-card">
            <span class="stat-label">Account</span>
            <strong>Active</strong>
          </div>

          <div class="stat-card">
            <span class="stat-label">Authentication</span>
            <strong>Supabase</strong>
          </div>

          <div class="stat-card">
            <span class="stat-label">Environment</span>
            <strong>GitHub Pages</strong>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
